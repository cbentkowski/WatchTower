name: Test, scan, and build container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  SEMGREP_IMAGE: semgrep/semgrep:1.177.0
  HADOLINT_IMAGE: hadolint/hadolint:v2.14.0-debian
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  GRYPE_IMAGE: anchore/grype:v0.119.0
  SYFT_IMAGE: anchore/syft:v1.52.0
  DOCKLE_IMAGE: goodwithtech/dockle:v0.4.15
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      application_changed: ${{ steps.changes.outputs.application_changed }}
      version_changed: ${{ steps.changes.outputs.version_changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "application_changed=true" >> "$GITHUB_OUTPUT"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$GITHUB_SHA^"
          fi
          documentation_only=true
          while IFS= read -r file; do
            [[ "$file" == *.md ]] || documentation_only=false
          done < <(git diff --name-only "$base" "$GITHUB_SHA")
          version_changed=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            previous_version="$(git show "$base:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            current_version="$(node -p "require('./package.json').version")"
            if [[ "$previous_version" != "$current_version" ]]; then
              version_changed=true
            fi
          fi
          if [[ "$documentation_only" == "true" ]]; then
            echo "application_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "application_changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version_changed=$version_changed" >> "$GITHUB_OUTPUT"

  documentation:
    name: Documentation checks
    needs: [classify]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate documentation links and anchors
        shell: bash
        run: node .github/scripts/check-docs.mjs $(git ls-files '*.md')

  test:
    name: Node.js tests
    needs: [classify]
    if: needs.classify.outputs.application_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  source-security:
    name: Source security
    needs: [classify]
    if: needs.classify.outputs.application_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare source security reports
        run: |
          mkdir -p "$RUNNER_TEMP/source-security"
          chmod 777 "$RUNNER_TEMP/source-security"
      - name: Audit production dependencies
        id: npm_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/source-security/npm-audit.json"
      - name: Scan Git history for secrets with Gitleaks
        id: gitleaks
        continue-on-error: true
        run: >-
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          --volume "$RUNNER_TEMP/source-security:/reports"
          "$GITLEAKS_IMAGE" git /repo --redact --no-banner
          --report-format json --report-path /reports/gitleaks.json
      - name: Analyze source with Semgrep
        id: semgrep
        continue-on-error: true
        run: >-
          docker run --rm --volume "$PWD:/src:ro" --workdir /src
          --volume "$RUNNER_TEMP/source-security:/reports"
          "$SEMGREP_IMAGE" semgrep scan --config p/javascript --config p/nodejs
          --error --severity ERROR --exclude node_modules
          --json --output /reports/semgrep.json /src
      - name: Lint Dockerfile with Hadolint
        id: hadolint
        continue-on-error: true
        run: |
          docker run --rm --volume "$PWD:/src:ro" "$HADOLINT_IMAGE" \
          hadolint --failure-threshold error --format json /src/Dockerfile \
            > "$RUNNER_TEMP/source-security/hadolint.json"
      - name: Upload source security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-security-reports-${{ github.sha }}
          path: ${{ runner.temp }}/source-security/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce source security gates
        if: always()
        env:
          NPM_AUDIT: ${{ steps.npm_audit.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          SEMGREP: ${{ steps.semgrep.outcome }}
          HADOLINT: ${{ steps.hadolint.outcome }}
        run: |
          for result in "$NPM_AUDIT" "$GITLEAKS" "$SEMGREP" "$HADOLINT"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more source security gates failed. Review the uploaded reports."
              exit 1
            fi
          done

  container-security:
    name: Container security
    needs: [classify, test, source-security]
    if: >-
      always() &&
      needs.classify.outputs.application_changed == 'true' &&
      needs.test.result == 'success' &&
      needs.source-security.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build local scan image
        run: docker build --pull --tag watchtower:security-scan .
      - name: Export image for read-only scanners
        run: |
          mkdir -p "$RUNNER_TEMP/watchtower-security" "$RUNNER_TEMP/container-security" "$RUNNER_TEMP/zap"
          chmod 777 "$RUNNER_TEMP/container-security" "$RUNNER_TEMP/zap"
          docker save watchtower:security-scan --output "$RUNNER_TEMP/watchtower-security/watchtower.tar"
      - name: Scan fixable image vulnerabilities with Trivy
        id: trivy
        continue-on-error: true
        run: >-
          docker run --rm --volume "$RUNNER_TEMP/watchtower-security:/scan:ro"
          --volume "$RUNNER_TEMP/container-security:/reports"
          "$TRIVY_IMAGE" image --input /scan/watchtower.tar --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 1 --no-progress --scanners vuln
          --format json --output /reports/trivy.json
      - name: Scan fixable image vulnerabilities with Grype
        id: grype
        continue-on-error: true
        run: |
          docker run --rm --volume "$RUNNER_TEMP/watchtower-security:/scan:ro" \
          "$GRYPE_IMAGE" docker-archive:/scan/watchtower.tar --only-fixed --fail-on high --output json \
            > "$RUNNER_TEMP/container-security/grype.json"
      - name: Check image hardening with Dockle
        id: dockle
        continue-on-error: true
        run: |
          docker run --rm --volume "$RUNNER_TEMP/watchtower-security:/scan:ro" \
          "$DOCKLE_IMAGE" --input /scan/watchtower.tar --exit-code 1 --exit-level warn \
          --ignore CIS-DI-0005,CIS-DI-0008 --format json \
            > "$RUNNER_TEMP/container-security/dockle.json"
      - name: Generate CycloneDX SBOM with Syft
        id: syft
        continue-on-error: true
        run: >-
          docker run --rm --volume "$RUNNER_TEMP/watchtower-security:/scan"
          "$SYFT_IMAGE" docker-archive:/scan/watchtower.tar
          --output cyclonedx-json=/scan/watchtower.cdx.json
      - name: Start an isolated WatchTower instance for ZAP
        id: zap_app
        continue-on-error: true
        run: |
          docker run --detach --name watchtower-zap \
            --env AUTH_DISABLED=true \
            --env AUTO_SCAN=false \
            --publish 4173:4173 \
            watchtower:security-scan
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs watchtower-zap
          exit 1
      - name: Run OWASP ZAP baseline scan
        id: zap
        continue-on-error: true
        run: >-
          docker run --rm --network host --volume "$RUNNER_TEMP/zap:/zap/wrk:rw"
          "$ZAP_IMAGE" zap-baseline.py -t http://127.0.0.1:4173
          -I -r zap-baseline.html -J zap-baseline.json
      - name: Enforce ZAP Medium and High policy
        id: zap_policy
        continue-on-error: true
        run: node .github/scripts/check-zap-report.mjs "$RUNNER_TEMP/zap/zap-baseline.json"
      - name: Capture application logs
        if: always()
        run: docker logs watchtower-zap > "$RUNNER_TEMP/zap/watchtower.log" 2>&1 || true
      - name: Stop isolated instance
        if: always()
        run: docker rm --force watchtower-zap || true
      - name: Upload container security reports and SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-reports-${{ github.sha }}
          path: |
            ${{ runner.temp }}/container-security/
            ${{ runner.temp }}/watchtower-security/watchtower.cdx.json
            ${{ runner.temp }}/zap/
          if-no-files-found: warn
          retention-days: 30
      - name: Read application version
        if: github.event_name == 'push'
        id: scanned_package
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Retain main branch CycloneDX SBOM
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchtower-${{ steps.scanned_package.outputs.version }}-${{ github.sha }}-cyclonedx-sbom
          path: ${{ runner.temp }}/watchtower-security/watchtower.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce container security gates
        if: always()
        env:
          TRIVY: ${{ steps.trivy.outcome }}
          GRYPE: ${{ steps.grype.outcome }}
          DOCKLE: ${{ steps.dockle.outcome }}
          SYFT: ${{ steps.syft.outcome }}
          ZAP_APP: ${{ steps.zap_app.outcome }}
          ZAP: ${{ steps.zap.outcome }}
          ZAP_POLICY: ${{ steps.zap_policy.outcome }}
        run: |
          for result in "$TRIVY" "$GRYPE" "$DOCKLE" "$SYFT" "$ZAP_APP" "$ZAP" "$ZAP_POLICY"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more container security gates failed. Review the uploaded reports."
              exit 1
            fi
          done

  publish:
    name: Publish container
    needs: [classify, test, source-security, container-security]
    if: >-
      always() &&
      needs.classify.outputs.application_changed == 'true' &&
      needs.test.result == 'success' &&
      needs.source-security.result == 'success' &&
      needs.container-security.result == 'success' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && needs.classify.outputs.version_changed == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read application version
        id: package
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Select image tags
        id: image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "tags=devynn76/watchtower:pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'tags<<EOF'
              echo "devynn76/watchtower:${{ steps.package.outputs.version }}"
              echo 'devynn76/watchtower:latest'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to Docker Hub
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish eligible images
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign published release by digest
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "devynn76/watchtower@${IMAGE_DIGEST}"

  release:
    name: Tag and publish release
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for a version change
        id: version_change
        shell: bash
        run: |
          previous_version="$(git show "$GITHUB_SHA^:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          current_version="$(node -p "require('./package.json').version")"
          if [[ "$previous_version" == "$current_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Read and validate release metadata
        if: steps.version_change.outputs.changed == 'true'
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes="release-notes/${tag}.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes: $notes"
            exit 1
          fi
          if grep -Eqi 'github\.com/.+/(issues|pull)/|(^|[[:space:]])#[0-9]+' "$notes"; then
            echo "Release notes must not link or refer to issues or pull requests."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: Create annotated version tag
        if: steps.version_change.outputs.changed == 'true'
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$TAG")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "$TAG already points to $tagged_commit, not tested commit $GITHUB_SHA."
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" --message "WatchTower $TAG"
            git push origin "$TAG"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release changelog
        if: steps.tag.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          cp "$NOTES" "$RUNNER_TEMP/release-notes.md"
          {
            echo
            echo "## Container image"
            echo
            echo "[devynn76/watchtower:${VERSION}](https://hub.docker.com/r/devynn76/watchtower/tags?name=${VERSION})"
          } >> "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "WatchTower $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
